name: Deploy Backend to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # schema.sql は CREATE TABLE/INDEX IF NOT EXISTS のみ。毎回流しても安全で、
      # 新しいテーブルは本番 D1 に自動反映される(既存テーブルのカラム追加は別途 migration 要)。
      - name: Apply D1 schema
        working-directory: backend
        run: |
          npx wrangler d1 execute xincere-db --remote --file=schema.sql
          # 既存テーブルへのカラム追加は IF NOT EXISTS が効かないので、
          # 重複エラーを無視して一度だけ通す(SQLite に ADD COLUMN IF NOT EXISTS は無い)。
          npx wrangler d1 execute xincere-db --remote --command "ALTER TABLE care_logs ADD COLUMN recorded_by TEXT NOT NULL DEFAULT ''" || echo "recorded_by already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2d478aaa7b96f93c7262f947b6c92488

      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2d478aaa7b96f93c7262f947b6c92488
